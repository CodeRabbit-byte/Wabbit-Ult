[package]
name = "wabbit-launcher"
version = "0.1.2"
edition = "2021"
autobins = false

[[bin]]
name = "wabbit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
