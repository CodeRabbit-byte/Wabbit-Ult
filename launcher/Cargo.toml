[package]
name = "wabbit-launcher"
version = "0.3.0"
edition = "2024"
autobins = false

[[bin]]
name = "wabbit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4.45"
eframe = "0.29.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
open = "5"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
ureq = { version = "2.10", features = ["json"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

# Small, fast single exe.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
